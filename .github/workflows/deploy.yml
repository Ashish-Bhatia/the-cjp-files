name: Deploy The CJP Files to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare reader-facing website only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html timeline.html methods.html myth-vs-reality.html association-investigation.html otpor-canvas.html sources.html about.html _site/
          cp -R assets _site/assets
          if [ -f 404.html ]; then cp 404.html _site/; fi
          if [ -f robots.txt ]; then cp robots.txt _site/; fi
          if [ -f sitemap.xml ]; then cp sitemap.xml _site/; fi
          touch _site/.nojekyll
          # Research manuscripts, internal audits, JSON working files and repository settings
          # remain in GitHub and are not copied into the public website artifact.

      - name: Upload public site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
